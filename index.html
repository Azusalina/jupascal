<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA / Add-to-Home-Screen: launches full-screen (no browser toolbar) on
         iPad/iPhone & Android, which is the only way to get the full viewport
         with no toolbar movement on scroll. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#11100e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JUPASCal" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- Brand/heading serif. Bundled via Google Fonts so the JUPASCal wordmark
         renders identically on iPad / Android / desktop instead of falling back
         to each platform's own system serif. Gelasio is Georgia-metric-compatible. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;600;700&display=swap" />

    <title>HKU & HKUST 2026 | Personal JUPASCal</title>
    <meta name="description" content="輸入你的 DSE 成績，按每個 JUPAS 課程的計分比重估算分數，並對比港大及科大往年的收生分數，了解各志願的排位機會。A free, unofficial JUPAS Calculator & DSE score calculator for selected HKU and HKUST programmes." />
    <meta name="keywords" content="JUPAS, JUPAS計分, JUPAS收生分數, JUPAS計算機, DSE計算, DSE分數計算, 大學收生分數, JUPAS calculator, DSE score calculator, Hong Kong university admission" />
    <meta name="author" content="JUPASCal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jupascal.com/" />

    <!-- Open Graph (used by share-link previews on WhatsApp / Facebook / etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JUPASCal" />
    <meta property="og:title" content="JUPAS Calculator 2026 – JUPASCal 收生計分器" />
    <meta property="og:description" content="輸入 DSE 成績，估算各 JUPAS 課程收生分數並對比往年數據，了解各志願的排位機會。" />
    <meta property="og:url" content="https://jupascal.com/" />
    <meta property="og:image" content="https://jupascal.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="zh_HK" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JUPAS Calculator 2026 – JUPASCal 收生計分器" />
    <meta name="twitter:description" content="輸入 DSE 成績，估算各 JUPAS 課程收生分數並對比往年數據，了解各志願的排位機會。" />
    <meta name="twitter:image" content="https://jupascal.com/og-image.png?v=2" />

    <!-- Structured data: tells search engines this is a free educational web app -->
    <style>
      /* Pre-load / no-JS background only. Set on <html> (NOT inline on <body>) so the
         app's `body { background: var(--bg) }` still wins once it mounts — an inline
         body background would override it and break dark mode. Respects the system
         preference before JS, and the app's data-theme toggle after. */
      body { margin: 0; }
      html { background: #11100e; }
      #seo-fallback { color: #eee8dc; }
      #seo-fallback .muted { color: #a59d90; }
      :root[data-theme="light"] { background: #f8f0ea; }
      :root[data-theme="dark"] { background: #11100e; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Static landing content for search engines and the no-JS / slow-load
           fallback. React (createRoot().render in src/main.tsx) REPLACES this the
           moment the app mounts, so users see it only briefly while JS loads.
           Keep the copy generic — no hard-coded programme count (project UI-copy rule). -->
      <main id="seo-fallback" style="max-width:680px;margin:0 auto;padding:48px 24px;font-family:system-ui;line-height:1.65">
        <h1>Personal HKU &amp; HKUST Calculator · 2026</h1>
        <p>Enter your HKDSE grades to calculate scores for your selected programmes using 2026 formulas.</p>
        <p lang="zh-Hant">輸入你的 DSE 成績，以 2026 年計分方法計算你選定的港大及科大課程分數。</p>
        <p><a href="/programmes/">Browse selected programmes · 瀏覽選定課程</a></p>
        <p class="muted">Loading the calculator…</p>
      </main>
    </div>
    <noscript><h1>Personal HKU &amp; HKUST Calculator</h1><p>Enable JavaScript to enter your grades and calculate scores using 2026 formulas.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
